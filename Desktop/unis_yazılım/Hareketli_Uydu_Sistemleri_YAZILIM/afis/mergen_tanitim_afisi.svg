<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754" viewBox="0 0 1240 1754">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061024"/>
      <stop offset="0.45" stop-color="#0b2f66"/>
      <stop offset="1" stop-color="#020817"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="41%" r="54%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.38"/>
      <stop offset="0.46" stop-color="#2563eb" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#020817" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a7f3d0"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.38"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="circuit" width="88" height="88" patternUnits="userSpaceOnUse">
      <path d="M0 44H28M60 44H88M44 0V28M44 60V88" stroke="#7dd3fc" stroke-opacity="0.10" stroke-width="1.2"/>
      <circle cx="44" cy="44" r="3" fill="#7dd3fc" fill-opacity="0.18"/>
    </pattern>
    <style>
      .display{font-family:Arial,Helvetica,sans-serif;font-weight:900;letter-spacing:-1.5px;fill:#fff}
      .head{font-family:Arial,Helvetica,sans-serif;font-weight:800;fill:#fff}
      .sub{font-family:Arial,Helvetica,sans-serif;font-weight:700;fill:#bfeaff}
      .body{font-family:Arial,Helvetica,sans-serif;font-weight:500;fill:#e7f7ff}
      .muted{font-family:Arial,Helvetica,sans-serif;font-weight:500;fill:#9fc4df}
      .cyan{font-family:Arial,Helvetica,sans-serif;font-weight:900;fill:#67e8f9}
      .dark{font-family:Arial,Helvetica,sans-serif;font-weight:900;fill:#04111f}
    </style>
  </defs>

  <rect width="1240" height="1754" fill="url(#bg)"/>
  <rect width="1240" height="1754" fill="url(#centerGlow)"/>
  <rect width="1240" height="1754" fill="url(#circuit)" opacity="0.9"/>

  <g opacity="0.35">
    <path d="M-80 420 C210 300 390 440 650 330 C850 245 1040 220 1300 300" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <path d="M-120 1420 C230 1190 560 1340 820 1170 C1010 1048 1140 1060 1320 1120" fill="none" stroke="#a7f3d0" stroke-width="2"/>
    <circle cx="1030" cy="280" r="260" fill="#0ea5e9" opacity="0.18"/>
    <circle cx="170" cy="1460" r="310" fill="#06b6d4" opacity="0.14"/>
  </g>

  <g transform="translate(60,54)">
    <rect x="0" y="0" width="1120" height="136" rx="34" fill="#06142a" fill-opacity="0.78" stroke="#67e8f9" stroke-opacity="0.32" stroke-width="2" filter="url(#shadow)"/>
    <image href="logo.png" x="28" y="22" width="92" height="92" preserveAspectRatio="xMidYMid meet"/>
    <text x="142" y="58" class="head" font-size="34">UniS</text>
    <text x="142" y="92" class="sub" font-size="18">Hareketli Uydu Terminali</text>
    <text x="142" y="116" class="muted" font-size="16">Üniversite ve Üzeri Kategorisi</text>

    <g transform="translate(838,18)">
      <circle cx="48" cy="48" r="45" fill="#082f49" stroke="#67e8f9" stroke-width="3"/>
      <text x="48" y="42" text-anchor="middle" class="head" font-size="15">ULUDAĞ</text>
      <text x="48" y="62" text-anchor="middle" class="muted" font-size="11">ÜNİ.</text>
    </g>
    <g transform="translate(956,18)">
      <circle cx="48" cy="48" r="45" fill="#0f172a" stroke="#a7f3d0" stroke-width="3"/>
      <text x="48" y="39" text-anchor="middle" class="head" font-size="12">YAZILIM</text>
      <text x="48" y="58" text-anchor="middle" class="muted" font-size="10">TOPLULUĞU</text>
    </g>
  </g>

  <g transform="translate(70,232)">
    <text x="0" y="0" class="cyan" font-size="26">ULUDAĞ YAZILIM TOPLULUĞU'NUN İLK TEKNOFEST TAKIMI</text>
    <text x="0" y="106" class="display" font-size="116">MERGEN</text>
    <text x="4" y="154" class="sub" font-size="32">Hareket halindeyken hedefini kaybetmeyen uydu terminali vizyonu</text>
    <rect x="4" y="184" width="620" height="9" rx="4" fill="url(#neon)"/>
  </g>

  <g transform="translate(300,470)" filter="url(#glow)">
    <ellipse cx="320" cy="260" rx="360" ry="112" fill="none" stroke="#38bdf8" stroke-opacity="0.44" stroke-width="4"/>
    <ellipse cx="320" cy="260" rx="270" ry="82" fill="none" stroke="#a7f3d0" stroke-opacity="0.34" stroke-width="3" transform="rotate(-14 320 260)"/>
    <circle cx="320" cy="260" r="138" fill="#06142a" stroke="#67e8f9" stroke-opacity="0.55" stroke-width="4"/>
    <path d="M202 315 Q320 142 438 315" fill="none" stroke="#f8fafc" stroke-width="20" stroke-linecap="round"/>
    <path d="M244 292 Q320 210 396 292" fill="none" stroke="#38bdf8" stroke-width="9" stroke-linecap="round"/>
    <rect x="300" y="250" width="40" height="128" rx="16" fill="#dbeafe"/>
    <line x1="320" y1="260" x2="502" y2="152" stroke="#a7f3d0" stroke-width="7" stroke-linecap="round"/>
    <circle cx="502" cy="152" r="16" fill="#a7f3d0"/>
    <text x="320" y="455" text-anchor="middle" class="muted" font-size="18">stabil takip • mobil platform • güvenilir yönelim</text>
  </g>

  <g transform="translate(70,682)">
    <rect x="0" y="0" width="300" height="248" rx="26" fill="#06142a" fill-opacity="0.78" stroke="#67e8f9" stroke-opacity="0.34" filter="url(#shadow)"/>
    <text x="24" y="48" class="cyan" font-size="22">AMACIMIZ</text>
    <text x="24" y="92" class="body" font-size="21">Hareketli platformlarda</text>
    <text x="24" y="124" class="body" font-size="21">anten yönelimini</text>
    <text x="24" y="156" class="body" font-size="21">koruyabilen, güvenilir</text>
    <text x="24" y="188" class="body" font-size="21">bir terminal konsepti</text>
    <text x="24" y="220" class="body" font-size="21">geliştirmek.</text>
  </g>

  <g transform="translate(870,682)">
    <rect x="0" y="0" width="300" height="248" rx="26" fill="#06142a" fill-opacity="0.78" stroke="#67e8f9" stroke-opacity="0.34" filter="url(#shadow)"/>
    <text x="24" y="48" class="cyan" font-size="22">VİZYONUMUZ</text>
    <text x="24" y="92" class="body" font-size="21">Kesintisiz haberleşme</text>
    <text x="24" y="124" class="body" font-size="21">için saha koşullarına</text>
    <text x="24" y="156" class="body" font-size="21">uygun, geliştirilebilir</text>
    <text x="24" y="188" class="body" font-size="21">ve yerli teknoloji</text>
    <text x="24" y="220" class="body" font-size="21">üretmek.</text>
  </g>

  <g transform="translate(70,1002)">
    <rect x="0" y="0" width="500" height="258" rx="28" fill="#07172f" fill-opacity="0.82" stroke="#38bdf8" stroke-opacity="0.36" filter="url(#shadow)"/>
    <text x="28" y="52" class="cyan" font-size="22">GÖREVİMİZ</text>
    <text x="28" y="100" class="body" font-size="23">Mekanik, elektronik ve yazılım</text>
    <text x="28" y="136" class="body" font-size="23">çalışmalarını ortak bir hedefte</text>
    <text x="28" y="172" class="body" font-size="23">birleştirerek yarışma şartlarına</text>
    <text x="28" y="208" class="body" font-size="23">uygun bir prototip altyapısı</text>
    <text x="28" y="244" class="body" font-size="23">oluşturmak.</text>
  </g>

  <g transform="translate(670,1002)">
    <rect x="0" y="0" width="500" height="258" rx="28" fill="#07172f" fill-opacity="0.82" stroke="#38bdf8" stroke-opacity="0.36" filter="url(#shadow)"/>
    <text x="28" y="52" class="cyan" font-size="22">NELER YAPIYORUZ?</text>
    <text x="28" y="98" class="body" font-size="22">• Hareketli terminal konsepti</text>
    <text x="28" y="134" class="body" font-size="22">• Stabil takip yazılım altyapısı</text>
    <text x="28" y="170" class="body" font-size="22">• Simülasyon ve doğrulama</text>
    <text x="28" y="206" class="body" font-size="22">• Kullanıcı arayüzü hazırlığı</text>
    <text x="28" y="242" class="body" font-size="22">• KTR ve sunum dokümantasyonu</text>
  </g>

  <g transform="translate(70,1324)">
    <rect x="0" y="0" width="1100" height="230" rx="30" fill="#06142a" fill-opacity="0.84" stroke="#a7f3d0" stroke-opacity="0.30" filter="url(#shadow)"/>
    <text x="32" y="54" class="cyan" font-size="24">TAKIM ÜYELERİ</text>
    <text x="32" y="104" class="body" font-size="22">Mehmet Efe Ekici • Simge Yeter • Kerim Yıldırım • Elif Toygar</text>
    <text x="32" y="142" class="body" font-size="22">Can Hakan Altınok • Kadir Mehmet Güleç</text>
    <text x="32" y="180" class="body" font-size="22">Mert Kayra Yılmaz • Yusuf Talha Vergili • Hidayet Sevim • Rabia Sıla Batum</text>
    <rect x="32" y="198" width="1036" height="1.5" fill="#67e8f9" opacity="0.28"/>
  </g>

  <g transform="translate(70,1608)">
    <rect x="0" y="0" width="1100" height="78" rx="23" fill="#020817" fill-opacity="0.72" stroke="#67e8f9" stroke-opacity="0.25"/>
    <text x="28" y="48" class="muted" font-size="22">UniS • Proje: Mergen • Kategori: Hareketli Uydu Terminali</text>
    <text x="870" y="48" class="muted" font-size="22">Tanıtım Afişi</text>
  </g>
</svg>
